name: Deploy VuePress site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build VuePress
        run: npm run docs:build
        env:
          DEPLOY_ENV: gh-pages
          GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          VITE_XIAKE_AUTH_BASE_URL: ${{ vars.XIAKE_AUTH_BASE_URL }}
          VITE_XIAKE_POST_LOGIN_URL: ${{ vars.XIAKE_POST_LOGIN_URL }}
          VITE_TAGFINDER_URL: ${{ vars.TAGFINDER_URL }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
